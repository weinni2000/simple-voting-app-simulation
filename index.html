<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Voting App</title>
</head>
<body>
    <h1>Vote for Your Favorite Fruit</h1>
    <div id="options">
        <input type="radio" name="fruit" value="Apple"> Apple<br>
        <input type="radio" name="fruit" value="Banana"> Banana<br>
        <input type="radio" name="fruit" value="Cherry"> Cherry<br>
        <input type="radio" name="fruit" value="Date"> Date<br>
    </div>
    <button id="voteButton">Vote</button>
    <div id="result" style="display:none;"><h2>Your Vote: <span id="votedFruit"></span></h2></div>
    <script src="app.js"></script>
</body>
</html>
